[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analise-eleitoral"
version = "0.3.1"
description = "Camada analítica reprodutível e neutra para os dados do projeto Eleições 2026"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9,<4",
  "python-pptx>=1.0,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
