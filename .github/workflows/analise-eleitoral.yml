name: Atualizar análises eleitorais

on:
  workflow_dispatch:
  schedule:
    # 00:55, 06:55, 12:55 e 18:55 em Brasília (UTC-3).
    # A janela é posterior às coletas regulares do repositório-fonte.
    - cron: "55 3,9,15,21 * * *"

permissions:
  contents: write

concurrency:
  group: analise-eleitoral-2026
  cancel-in-progress: false

jobs:
  analisar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout da camada analítica
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout do repositório-fonte
        uses: actions/checkout@v4
        with:
          repository: MSsanto/Elei-oes-2026
          ref: main
          path: source/Elei-oes-2026
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -e .

      - name: Gerar análises
        run: python scripts/run_analysis.py --source source/Elei-oes-2026 --output .

      - name: Validar
        run: |
          pytest -q
          python scripts/check_governance.py
          python scripts/validate_outputs.py

      - name: Publicar derivados quando houver mudança
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived docs/reports assets/charts presentations/briefing-executivo-latest.pptx

          if git diff --cached --quiet; then
            echo "Nenhuma mudança analítica para publicar."
            exit 0
          fi

          git commit -m "data: atualizar snapshot analítico [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
